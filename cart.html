<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | VISION X</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="/CSS/style.css">
</head>

<body>

    <!-- NAVBAR -->

    <header class="header">

        <nav class="navbar">

            <a href="index.html" class="logo">
                👓 <span>VISION X</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="collection.html">COLLECTION</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>

            <div class="nav-icons">

                <a href="collection.html">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </a>

                <a href="cart.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount">0</span>
                </a>

            </div>

        </nav>

    </header>


    <!-- CART HERO -->

    <section class="cart-hero">

        <p>VISION X</p>

        <h1>YOUR CART</h1>

        <span>Review your selected eyewear.</span>

    </section>


    <!-- CART SECTION -->

    <section class="cart-section">

        <div class="cart-container">

            <!-- PRODUCTS WILL APPEAR HERE -->

            <div class="cart-products" id="cartProducts">
            </div>


            <!-- CART SUMMARY -->

            <div class="cart-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cartSubtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <span>FREE</span>
                </div>

                <div class="summary-total">
                    <span>Total</span>
                    <span id="cartTotal">₹0</span>
                </div>

                <button class="checkout-btn">
                    PROCEED TO CHECKOUT
                </button>

                <a href="collection.html" class="continue-shopping">
                    ← Continue Shopping
                </a>

            </div>

        </div>

    </section>

<script>

/* ================= CART PAGE ================= */

let cart = JSON.parse(localStorage.getItem("visionXCart")) || [];

const cartProducts = document.getElementById("cartProducts");
const cartSubtotal = document.getElementById("cartSubtotal");
const cartTotal = document.getElementById("cartTotal");


function displayCart() {

    cartProducts.innerHTML = "";

    let subtotal = 0;

    if (cart.length === 0) {

        cartProducts.innerHTML = `
            <div class="empty-cart">
                <h3>Your cart is empty</h3>
                <p>Add some premium eyewear to your cart.</p>
                <a href="collection.html">SHOP COLLECTION</a>
            </div>
        `;

        cartSubtotal.textContent = "₹0";
        cartTotal.textContent = "₹0";

        return;
    }


    cart.forEach((product, index) => {

        /* Fix price */
        let price = Number(
            String(product.price || 0)
            .replace(/[₹,]/g, "")
        );

        let quantity = Number(product.quantity) || 1;

        subtotal += price * quantity;


        /* Fix image */
        let image =
            product.image ||
            product.imageUrl ||
            product.img ||
            "";


        cartProducts.innerHTML += `

            <div class="cart-item">

                <div class="cart-item-image">

                    <img
                        src="${image}"
                        alt="${product.name || "Eyewear"}"
                    >

                </div>


                <div class="cart-item-info">

                    <h3>
                        ${product.name || "VISION X PREMIUM"}
                    </h3>

                    <p class="cart-item-price">
                        ₹${price.toLocaleString("en-IN")}
                    </p>


                    <div class="cart-quantity">

                        <button onclick="decreaseQuantity(${index})">
                            −
                        </button>

                        <span>
                            ${quantity}
                        </span>

                        <button onclick="increaseQuantity(${index})">
                            +
                        </button>

                    </div>


                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})"
                    >
                        REMOVE
                    </button>

                </div>

            </div>

        `;
    });


    /* Show total */

    cartSubtotal.textContent =
        "₹" + subtotal.toLocaleString("en-IN");

    cartTotal.textContent =
        "₹" + subtotal.toLocaleString("en-IN");
}


/* ================= INCREASE ================= */

function increaseQuantity(index) {

    cart[index].quantity =
        (Number(cart[index].quantity) || 1) + 1;

    localStorage.setItem(
        "visionXCart",
        JSON.stringify(cart)
    );

    displayCart();
}


/* ================= DECREASE ================= */

function decreaseQuantity(index) {

    let quantity =
        Number(cart[index].quantity) || 1;

    if (quantity > 1) {

        cart[index].quantity = quantity - 1;

    } else {

        cart.splice(index, 1);

    }

    localStorage.setItem(
        "visionXCart",
        JSON.stringify(cart)
    );

    displayCart();
}


/* ================= REMOVE ================= */

function removeItem(index) {

    cart.splice(index, 1);

    localStorage.setItem(
        "visionXCart",
        JSON.stringify(cart)
    );

    displayCart();
}


/* ================= LOAD CART ================= */

displayCart();

</script>
</body>
</html>
